<script>
(function () {
  const isTrackingPage =
    window.location.search.includes('track=') ||
    window.location.search.includes('page=privacy');

  if (!isTrackingPage) {
    const manifest = document.createElement('link');
    manifest.rel = 'manifest';
    manifest.href = '/manifest.webmanifest';
    document.head.appendChild(manifest);
  } else {
    document
      .querySelectorAll(
        'link[rel="manifest"], link[rel="apple-touch-icon"]'
      )
      .forEach(el => el.remove());

    document
      .querySelectorAll(
        'meta[name="mobile-web-app-capable"], meta[name="apple-mobile-web-app-capable"]'
      )
      .forEach(el => el.remove());

    document
      .querySelectorAll(
        'meta[name="apple-mobile-web-app-title"]'
      )
      .forEach(el => el.remove());
  }
})();
</script>
